version: 2

registries:
  private-github:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{ secrets.PRIVATE_SUBMODULE_TOKEN }}

# Minor and patch updates are grouped into one pull request per entry. Each pull request runs the
# whole CI, so one pull request per package flooded the shared runner pool: three pip updates on
# one morning queued every other pull request for more than an hour. Major updates are the ones
# that break things, so they keep a pull request of their own.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      github-actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    assignees:
      - Laennart

  - package-ecosystem: "nuget"
    directory: "/roles/"
    target-branch: "develop"
    schedule:
      interval: "daily"
    registries:
      - private-github
    groups:
      nuget-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    assignees:
      - SolidProgramming

  - package-ecosystem: "pip"
    directory: "/roles/importer/files/importer"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30
      include:
        - "ruff"
    ignore:
      # scrapli >=2026.5 is the native libscrapli rewrite (scrapli 2); the ASA importer still uses the scrapli 1 API
      - dependency-name: "scrapli"
        versions: [">=2026.5"]
    groups:
      pip-importer-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    assignees:
      - Laennart

  - package-ecosystem: "pip"
    directory: "/scripts/customizing/app_data_import"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      pip-app-data-import-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    assignees:
      - Laennart

  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    ignore:
      # ansible >=13 requires Python >=3.12, unavailable on Debian 12 (see requirements.txt)
      - dependency-name: "ansible"
        versions: [">=13"]
    groups:
      pip-installer-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    assignees:
      - Laennart
