version: 2

# FORK TEST ONLY (PR #5165): only ruff updates for the importer requirements.
updates:
  - package-ecosystem: "pip"
    directory: "/roles/importer/files/importer"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30
      include:
        - "ruff"
    allow:
      - dependency-name: "ruff"
