name: FWO Test Install
# NOTE: this workflow's behavior (trigger/matrix logic) is documented in
# documentation/developer-docs/github/test-install-workflow.md - please
# keep that doc in sync when changing triggers, matrix, or job logic here.

on:
  workflow_dispatch:
    inputs:
      full:
        description: Run Full Test Matrix
        type: boolean
        default: false
        required: true
  push:
    branches:
      - main
      - develop
  pull_request:

# A newer push to a pull request cancels its running checks. On main and develop a running full
# matrix is allowed to finish instead: with max-parallel below it takes long enough that frequent
# merges would otherwise cancel every run before it completes. GitHub keeps at most one pending
# run per group and replaces it with the newest, so only the latest commit waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup:
    name: Determine test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      max_parallel: ${{ steps.set-matrix.outputs.max_parallel }}
      python_versions: ${{ steps.set-matrix.outputs.python_versions }}
    steps:
      - name: Select matrix based on event
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
          INPUT_FULL: ${{ inputs.full }}
        run: |
          set -euo pipefail

          # Runners are shared by every workflow and pull request, and GitHub has no job
          # priority. Capping the full matrix leaves the rest of the pool to pull requests.
          kFullMatrixMaxParallel=5

          full=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            full="$INPUT_FULL"
          elif [ "$EVENT_NAME" = "push" ] && [[ "$REF" =~ ^refs/heads/(main|develop)$ ]]; then
            full=true
          fi

          # Python dependency updates get the Python version matrix of the unit tests instead of
          # the 15 job install matrix; the install itself is covered by the minimal matrix here
          # and by the full matrix once the update is merged.
          python_versions="$full"
          if [ "$EVENT_NAME" = "pull_request" ] && [[ "$HEAD_REF" == dependabot/pip/* ]]; then
            python_versions=true
          fi

          if [ "$full" = "true" ]; then
            matrix='{"include":[
              {"os":"ubuntu-26.04","python":"3.10","integration":false,"label":"Test install on ubuntu-26.04 with Python 3.10"},
              {"os":"ubuntu-26.04","python":"3.11","integration":false,"label":"Test install on ubuntu-26.04 with Python 3.11"},
              {"os":"ubuntu-26.04","python":"3.12","integration":false,"label":"Test install on ubuntu-26.04 with Python 3.12"},
              {"os":"ubuntu-26.04","python":"3.13","integration":false,"label":"Test install on ubuntu-26.04 with Python 3.13"},
              {"os":"ubuntu-26.04","python":"3.14","integration":false,"label":"Test install on ubuntu-26.04 with Python 3.14"},
              {"os":"ubuntu-24.04","python":"3.10","integration":true,"label":"Test install on ubuntu-24.04 with Python 3.10"},
              {"os":"ubuntu-24.04","python":"3.11","integration":true,"label":"Test install on ubuntu-latest"},
              {"os":"ubuntu-24.04","python":"3.12","integration":false,"label":"Test install on ubuntu-24.04 with Python 3.12"},
              {"os":"ubuntu-24.04","python":"3.13","integration":false,"label":"Test install on ubuntu-24.04 with Python 3.13"},
              {"os":"ubuntu-24.04","python":"3.14","integration":false,"label":"Test install on ubuntu-24.04 with Python 3.14"},
              {"os":"ubuntu-22.04","python":"3.10","integration":false,"label":"Test install on ubuntu-22.04 with Python 3.10"},
              {"os":"ubuntu-22.04","python":"3.11","integration":false,"label":"Test install on ubuntu-22.04 with Python 3.11"},
              {"os":"ubuntu-22.04","python":"3.12","integration":false,"label":"Test install on ubuntu-22.04 with Python 3.12"},
              {"os":"ubuntu-22.04","python":"3.13","integration":false,"label":"Test install on ubuntu-22.04 with Python 3.13"},
              {"os":"ubuntu-22.04","python":"3.14","integration":false,"label":"Test install on ubuntu-22.04 with Python 3.14"}
            ]}'
          else
            # Both pinned ansible generations, and both with the integration tests, because
            # requirements.txt installs ansible 10.7.0 (ansible-core 2.18) below python 3.11
            # and 12.3.0 (core 2.19) from 3.11 up, and the two do not evaluate a "when" or
            # "assert.that" the same way: core 2.18 wraps the expression as
            # "{% if <expr> %}", where Jinja's if-statement parser rejects a bare
            # conditional expression that core 2.19 accepts as an expression. A matrix that
            # runs the roles/tests-integration suite on one generation only cannot see that
            # class of defect at all - it reached a customer installation once already.
            # Keep an integration run on each generation, or the older one is untested.
            matrix='{"include":[
              {"os":"ubuntu-24.04","python":"3.11","integration":true,"label":"Test install on ubuntu-latest"},
              {"os":"ubuntu-24.04","python":"3.10","integration":true,"label":"Test install on ubuntu-latest with ansible-core 2.18"}
            ]}'
          fi

          # Collapse to a single line for the step output.
          matrix="$(echo "$matrix" | tr -d '\n' | tr -s ' ')"

          if ! echo "$matrix" | jq empty; then
            echo "::error::Generated matrix is not valid JSON: $matrix"
            exit 1
          fi

          combos=$(echo "$matrix" | jq '.include | length')
          max_parallel="$combos"
          if [ "$full" = "true" ]; then
            max_parallel="$kFullMatrixMaxParallel"
          fi
          echo "::notice::full=$full, selected $combos matrix combo(s), at most $max_parallel at once, python_versions=$python_versions"

          {
            echo "matrix=$matrix"
            echo "max_parallel=$max_parallel"
            echo "python_versions=$python_versions"
          } >> "$GITHUB_OUTPUT"

  test-install:
    needs: setup
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    env:
      RUNNING_ON_GITHUB_ACTIONS: true
      FWO_RUN_INTEGRATION_TESTS: "true"
      FWO_TEST_USERNAME: "integration_user_jwt_refresh_test"
      FWO_TEST_PASSWORD: "testpassword"
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.setup.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install build-essential ldap-utils libldap2-dev libsasl2-dev -y
          python -m pip install -r requirements.txt

      - name: Install Ansible collections
        run: |
          cd ${{ github.workspace }}
          ansible-galaxy collection install -r collections/requirements.yml -p collections --force

      - name: Run sample LDAP seeding regression tests
        if: ${{ matrix.integration }}
        run: bash scripts/tests/test-sample-auth-data.sh

      # Demo data is off by default since GHSA-3v53-q5h9-pvfh, but the tests rely on it: sample-auth-data
      # creates the LDAP user of the JWT integration tests (integration_user_jwt_refresh_test), and the
      # integration tests use the sample devices, tenants and users. So every run requests it explicitly.
      #
      # unittests_run is skipped in the integration flow: the csharp-unit-tests and python-code-check
      # jobs run the same suites in parallel, and running them inside both playbook runs below cost
      # about 8 minutes per job. The test project is still deployed, the JWT step runs from it. The
      # plain installs of the full matrix keep running the unit tests on the installed system.
      - name: Run Ansible test install without integration cleanup
        if: ${{ matrix.integration }}
        run: |
          cd ${{ github.workspace }}
          ./scripts/run-playbook-with-sudo.sh site.yml -e force_install=true -e add_demo_data=yes --skip-tags integrationtests,unittests_run

      - name: Run Ansible test install
        if: ${{ !matrix.integration }}
        run: |
          cd ${{ github.workspace }}
          ./scripts/run-playbook-with-sudo.sh site.yml -e force_install=true -e add_demo_data=yes -e "ansible_python_interpreter=$(which python)"

      - name: Run JWT refresh integration tests
        if: ${{ matrix.integration }}
        run: |
          sudo -u fworch env \
            RUNNING_ON_GITHUB_ACTIONS=true \
            FWO_RUN_INTEGRATION_TESTS=true \
            FWO_TEST_USERNAME=integration_user_jwt_refresh_test \
            FWO_TEST_PASSWORD=testpassword \
            dotnet test /usr/local/fworch/test/csharp/FWO.Test/FWO.Test.csproj --filter "FullyQualifiedName~AuthenticationTokenIntegrationTest" --blame-hang-timeout 5m --blame-hang-dump-type none

      - name: Collect middleware diagnostics after JWT test failure
        if: ${{ matrix.integration && failure() }}
        run: |
          sudo systemctl status fworch-middleware --no-pager || true
          sudo journalctl -u fworch-middleware --no-pager -n 200 || true
          sudo tail -n 200 /var/log/fworch/middleware.log || true
          sudo tail -n 200 /var/log/apache2/error.log || true

      - name: Run Ansible integration tests with cleanup
        if: ${{ matrix.integration && success() }}
        run: |
          cd ${{ github.workspace }}
          ./scripts/run-playbook-with-sudo.sh site.yml -e force_install=true -e add_demo_data=yes --tags integrationtests

      # A full run rather than "--tags integrationtests", because roles/tests-integration
      # asserts on facts the reset itself produces - the retired CA names, which identities
      # were reissued, which customer-managed pairs were left untouched - and those exist
      # only inside the invocation that performed the rotation. This is also the only run
      # that exercises the force-regeneration paths in create-ca.yml and
      # issue-certificates.yml, and that proves every service still comes up against a CA
      # anchor that changed underneath it. Only unittests_run is skipped, see the first install step.
      - name: Run Ansible certificate reset upgrade with integration tests
        if: ${{ matrix.integration && success() }}
        run: |
          cd ${{ github.workspace }}
          ./scripts/run-playbook-with-sudo.sh site.yml \
            -e force_install=true \
            -e add_demo_data=yes \
            -e "installation_mode=upgrade internalca_reset_certificates=true" \
            --skip-tags unittests_run

      - name: Collect certificate diagnostics after a failed reset upgrade
        if: ${{ matrix.integration && failure() }}
        run: |
          sudo ls -la /usr/local/fworch/etc/secrets/ca/ || true
          sudo cat /usr/local/fworch/etc/secrets/ca/retired-ca-names || true
          sudo openssl x509 -in /usr/local/fworch/etc/fworch-internal-ca.crt -noout -subject -dates || true
          sudo apachectl configtest || true
          sudo tail -n 100 /var/log/apache2/error.log || true


  launcher-guard-tests:
    name: Launcher guard regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Stubbed ansible/ansible-galaxy, so no real Ansible install is needed.
      - name: Run run-playbook-with-sudo.sh guard tests
        run: ./scripts/tests/test-run-playbook-with-sudo.sh

  # The C# unit tests on the runner itself, in parallel with the installs. They need no
  # installation; the default runsettings turn the integration tests off, and HtmlToPdfTest skips
  # itself on GitHub Actions. They stay in Debug: in Release, ConfigFile exits the process on an
  # unreadable config file (#if RELEASE), which ends the test host in IncorrectSyntaxConfigFile.
  csharp-unit-tests:
    name: C# unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Run C# unit tests
        run: dotnet test roles/tests-unit/files/FWO.Test/FWO.Test.csproj --configuration Debug --settings FWO.default.runsettings

  # Python dependency updates and the full matrix only: the importer and customizing code
  # supports Python 3.10 and newer, the PR set tests 3.11 in python-code-check.
  python-unit-tests:
    needs: setup
    if: ${{ needs.setup.outputs.python_versions == 'true' }}
    name: Python unit tests on Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # Each requirements file goes into an environment of its own, as on an installed system:
      # the installer requirements run Ansible, the importer ones the importer venv.
      - name: Install the installer requirements
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libldap2-dev libsasl2-dev
          python -m venv "$RUNNER_TEMP/installer-venv"
          "$RUNNER_TEMP/installer-venv/bin/python" -m pip install -r requirements.txt

      - name: Install the importer and scripts requirements
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --only-binary=cryptography --prefer-binary -r roles/importer/files/importer/requirements.txt -r scripts/requirements.txt

      - name: Run importer and customizing unit tests
        run: .venv/bin/python -m pytest -q roles/importer/files/importer/test scripts/customizing

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      # The installer publishes middleware and UI in Release, while the other workflows build Debug. Warnings are
      # errors, so a warning that only occurs in Release (e.g. a variable used only inside #if DEBUG) would break
      # every installation unnoticed (GHSA-9j26-vffp-8f83).
      - name: Build all projects in Release configuration
        run: dotnet build roles/FWO.sln --configuration Release

  python-code-check:
    name: Python Code Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - run: python -m venv .venv

      - run: ".venv/bin/python -m pip install --only-binary=cryptography --prefer-binary -r roles/importer/files/importer/requirements.txt"

      - run: ".venv/bin/python -m pip install --only-binary=cryptography --prefer-binary -r scripts/requirements.txt"

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
        with:
          version-file: "roles/importer/files/importer/requirements.txt"

      - name: pyright
        run: |
          .venv/bin/pyright --version
          .venv/bin/pyright

      - run: ruff check

      - run: ruff format --exit-non-zero-on-format

      # The importer tests ran inside the install before; the scripts tests include the version
      # gate and workflow policy tests in scripts/ci.
      - name: Python unit tests
        run: ".venv/bin/python -m pytest -q roles/importer/files/importer/test scripts"
