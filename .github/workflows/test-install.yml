name: FWO Test Install
# NOTE: this workflow's behavior (triggers, test plan, job contents) is documented in
# documentation/developer-docs/github/test-install-workflow.md - please keep that doc in
# sync when changing triggers, the plan or job logic here.
#
# A pull request installs on Ubuntu 24.04 and runs the Python unit tests on Python 3.11. The
# installs on every supported Ubuntu version and the Python unit tests on every supported
# Python version run after the merge into develop, and on the pull requests they exist for:
# Ansible changes also install on Ubuntu 22.04 (ansible-core 2.18), Dependabot pip updates run
# every Python version. scripts/ci/install_plan.py makes that choice. A failure after the merge
# is reported to the merged pull request. The C# unit tests run in the Sonar workflows, which
# need them for coverage.

on:
  workflow_dispatch:
    inputs:
      full:
        description: Run every install and Python version, as after a merge
        type: boolean
        default: false
        required: true
  push:
    branches:
      - main
      - develop
  pull_request:

# A newer push to a pull request cancels its running checks. On main and develop every commit
# gets a run of its own instead, so that a failure after a merge points at the pull request
# whose merge caused it: in one shared group GitHub would replace a waiting run by the next
# merge, and the commits in between would never be tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Determine test plan
    runs-on: ubuntu-latest
    outputs:
      install_matrix: ${{ steps.plan.outputs.install_matrix }}
      python_versions: ${{ steps.plan.outputs.python_versions }}
      version_ok: ${{ steps.version.outputs.ok || 'true' }}
    steps:
      # A pull request checks out its merge commit; depth 2 adds its first parent, the base
      # branch, which the changed files are listed against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: List the files the pull request changes
        if: ${{ github.event_name == 'pull_request' }}
        run: git diff --no-renames --name-only -z HEAD^1 HEAD >"$RUNNER_TEMP/changed-files"

      - name: Select installs and Python versions
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
          INPUT_FULL: ${{ inputs.full }}
        run: |
          set -euo pipefail
          changed_files=()
          if [[ -f "$RUNNER_TEMP/changed-files" ]]; then
            changed_files=(--changed-files "$RUNNER_TEMP/changed-files")
          fi
          python3 scripts/ci/install_plan.py \
            --event-name "$EVENT_NAME" \
            --ref "$REF" \
            --head-ref "$HEAD_REF" \
            --full "${INPUT_FULL:-false}" \
            "${changed_files[@]}" \
            --output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      # The same evaluation as the required "Gate pull request version" check, run as the first
      # job of the pull request's own run, so that a pull request that needs a version bump
      # learns it before its installs run. This copy runs the pull request's own script and is
      # only an early signal; the binding gate runs in version-gate.yml from the base branch.
      - name: Check the version early
        id: version
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if scripts/ci/evaluate_version_gate.sh "$PR_NUMBER" "$PR_BASE_REF"; then
            echo "ok=true" >>"$GITHUB_OUTPUT"
          else
            echo "ok=false" >>"$GITHUB_OUTPUT"
            echo "::error title=Version gate::The version of this pull request cannot be merged as it is, see the log of this step. The installs stop right away."
          fi

  test-install:
    needs: plan
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    env:
      RUNNING_ON_GITHUB_ACTIONS: true
      FWO_RUN_INTEGRATION_TESTS: "true"
      FWO_TEST_USERNAME: "integration_user_jwt_refresh_test"
      FWO_TEST_PASSWORD: "testpassword"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.install_matrix) }}
    steps:
      # Fails rather than skips: GitHub counts a skipped required check as passed, so a skipped
      # "Test install on ubuntu-latest" would let a pull request merge without an install.
      - name: Stop when the version gate fails
        if: ${{ needs.plan.outputs.version_ok != 'true' }}
        run: |
          echo "::error title=Version gate::The version of this pull request cannot be merged as it is, see the 'Check the version early' step of 'Determine test plan'."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # The installer environment of a real installation: a venv of the system's own python3
      # (3.10 on Ubuntu 22.04, 3.12 on 24.04, 3.14 on 26.04), which also decides the pinned
      # Ansible version, see requirements.txt. The importer venv uses the same interpreter.
      - name: Set up the installer environment
        run: |
          source scripts/install-ansible-from-venv.sh
          echo "$VIRTUAL_ENV/bin" >>"$GITHUB_PATH"
          ansible --version

      - name: Run sample LDAP seeding regression tests
        run: bash scripts/tests/test-sample-auth-data.sh

      # Demo data is off by default since GHSA-3v53-q5h9-pvfh, but the tests rely on it: sample-auth-data
      # creates the LDAP user of the JWT integration tests (integration_user_jwt_refresh_test), and the
      # integration tests use the sample devices, tenants and users. So every run requests it explicitly.
      #
      # unittests_run is skipped in both playbook runs: the C# unit tests run in the Sonar workflows and
      # the Python unit tests in python-unit-tests. The test project is still deployed, the JWT step
      # runs from it.
      - name: Run Ansible test install
        run: |
          cd ${{ github.workspace }}
          ./scripts/run-playbook-with-sudo.sh site.yml -e force_install=true -e add_demo_data=yes --skip-tags integrationtests,unittests_run

      - name: Run JWT refresh integration tests
        run: |
          sudo -u fworch env \
            RUNNING_ON_GITHUB_ACTIONS=true \
            FWO_RUN_INTEGRATION_TESTS=true \
            FWO_TEST_USERNAME=integration_user_jwt_refresh_test \
            FWO_TEST_PASSWORD=testpassword \
            dotnet test /usr/local/fworch/test/csharp/FWO.Test/FWO.Test.csproj --filter "FullyQualifiedName~AuthenticationTokenIntegrationTest" --blame-hang-timeout 5m --blame-hang-dump-type none

      - name: Collect middleware diagnostics after JWT test failure
        if: ${{ failure() && needs.plan.outputs.version_ok == 'true' }}
        run: |
          sudo systemctl status fworch-middleware --no-pager || true
          sudo journalctl -u fworch-middleware --no-pager -n 200 || true
          sudo tail -n 200 /var/log/fworch/middleware.log || true
          sudo tail -n 200 /var/log/apache2/error.log || true

      - name: Run Ansible integration tests with cleanup
        if: ${{ success() }}
        run: |
          cd ${{ github.workspace }}
          ./scripts/run-playbook-with-sudo.sh site.yml -e force_install=true -e add_demo_data=yes --tags integrationtests

      # A full run rather than "--tags integrationtests", because roles/tests-integration
      # asserts on facts the reset itself produces - the retired CA names, which identities
      # were reissued, which customer-managed pairs were left untouched - and those exist
      # only inside the invocation that performed the rotation. This is also the only run
      # that exercises the force-regeneration paths in create-ca.yml and
      # issue-certificates.yml, and that proves every service still comes up against a CA
      # anchor that changed underneath it. Only unittests_run is skipped, see the install step.
      - name: Run Ansible certificate reset upgrade with integration tests
        if: ${{ success() }}
        run: |
          cd ${{ github.workspace }}
          ./scripts/run-playbook-with-sudo.sh site.yml \
            -e force_install=true \
            -e add_demo_data=yes \
            -e "installation_mode=upgrade internalca_reset_certificates=true" \
            --skip-tags unittests_run

      - name: Collect certificate diagnostics after a failed reset upgrade
        if: ${{ failure() && needs.plan.outputs.version_ok == 'true' }}
        run: |
          sudo ls -la /usr/local/fworch/etc/secrets/ca/ || true
          sudo cat /usr/local/fworch/etc/secrets/ca/retired-ca-names || true
          sudo openssl x509 -in /usr/local/fworch/etc/fworch-internal-ca.crt -noout -subject -dates || true
          sudo apachectl configtest || true
          sudo tail -n 100 /var/log/apache2/error.log || true

  launcher-guard-tests:
    name: Launcher guard regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Stubbed ansible/ansible-galaxy, so no real Ansible install is needed.
      - name: Run run-playbook-with-sudo.sh guard tests
        run: ./scripts/tests/test-run-playbook-with-sudo.sh

  # Python 3.11 on a pull request, every supported version after a merge and on Dependabot pip
  # updates. Pyright in python-code-check reports APIs the oldest and the newest supported
  # Python lack on every pull request already.
  python-unit-tests:
    needs: plan
    name: Python unit tests on Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.plan.outputs.python_versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # Each requirements file goes into an environment of its own, as on an installed system:
      # the installer requirements run Ansible, the importer ones the importer venv. Installing the
      # installer requirements proves that the pinned Ansible still installs on this version.
      - name: Install the installer requirements
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libldap2-dev libsasl2-dev
          python -m venv "$RUNNER_TEMP/installer-venv"
          "$RUNNER_TEMP/installer-venv/bin/python" -m pip install -r requirements.txt

      - name: Install the importer and scripts requirements
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --only-binary=cryptography --prefer-binary -r roles/importer/files/importer/requirements.txt -r scripts/requirements.txt

      # The scripts tests include the customizing scripts, the version gate and the workflow
      # policy tests in scripts/ci.
      - name: Run importer and scripts unit tests
        run: .venv/bin/python -m pytest -q roles/importer/files/importer/test scripts

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      # The installer publishes middleware and UI in Release, while the other workflows build Debug. Warnings are
      # errors, so a warning that only occurs in Release (e.g. a variable used only inside #if DEBUG) would break
      # every installation unnoticed (GHSA-9j26-vffp-8f83).
      - name: Build all projects in Release configuration
        run: dotnet build roles/FWO.sln --configuration Release

  python-code-check:
    name: Python Code Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - run: python -m venv .venv

      - run: ".venv/bin/python -m pip install --only-binary=cryptography --prefer-binary -r roles/importer/files/importer/requirements.txt"

      - run: ".venv/bin/python -m pip install --only-binary=cryptography --prefer-binary -r scripts/requirements.txt"

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
        with:
          version-file: "roles/importer/files/importer/requirements.txt"

      # pyproject.toml sets the oldest supported Python (3.10), which reports APIs only newer
      # versions provide; the second pass with the newest one reports what newer versions removed.
      - name: pyright
        run: |
          .venv/bin/pyright --version
          .venv/bin/pyright
          .venv/bin/pyright --pythonversion 3.14

      - run: ruff check

      - run: ruff format --exit-non-zero-on-format

  # Most of these checks run only after a merge, so their failure would otherwise only show in
  # the commit history of develop. This comments on the pull request whose merge produced the
  # commit, which notifies its author and reviewers.
  report-merge-failure:
    name: Report failed checks to the merged pull request
    needs: [plan, test-install, python-unit-tests]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/develop' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Comment on the merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          python3 scripts/ci/report_merge_failure.py \
            --repository "$REPOSITORY" \
            --commit-sha "$COMMIT_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --server-url "$SERVER_URL"
